<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background Blob -->
  <path d="M150,500 C100,500 50,450 50,400 C50,300 200,200 350,150 C500,100 700,200 750,350 C800,500 650,550 500,550 C350,550 200,500 150,500 Z" fill="#2BB3B1" opacity="0.15" />
  
  <!-- Desk -->
  <rect x="150" y="420" width="500" height="15" rx="7.5" fill="#E2E8F0" />
  <rect x="200" y="435" width="20" height="80" rx="4" fill="#64748B" />
  <rect x="580" y="435" width="20" height="80" rx="4" fill="#64748B" />
  
  <!-- Monitor -->
  <rect x="350" y="320" width="100" height="70" rx="5" fill="#0B3B60" />
  <rect x="360" y="330" width="80" height="50" rx="2" fill="#E2E8F0" />
  <rect x="390" y="390" width="20" height="30" fill="#0B3B60" />
  <rect x="370" y="415" width="60" height="5" rx="2" fill="#0B3B60" />

  <!-- Doctor -->
  <circle cx="280" cy="280" r="30" fill="#FDBA74" />
  <path d="M240,420 L240,360 C240,330 260,310 280,310 C300,310 320,330 320,360 L320,420 Z" fill="#FFFFFF" />
  <!-- Stethoscope -->
  <path d="M260,340 C260,370 300,370 300,340" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
  <circle cx="280" cy="380" r="8" fill="#64748B" />
  <path d="M280,360 L280,380" stroke="#64748B" stroke-width="4" />
  <!-- Doctor Hair -->
  <path d="M250,280 C250,250 280,240 300,250 C310,260 310,280 300,290 C280,270 250,270 250,280 Z" fill="#0B3B60" />
  
  <!-- Patient -->
  <circle cx="520" cy="300" r="28" fill="#FDBA74" />
  <path d="M480,420 L480,370 C480,340 500,330 520,330 C540,330 560,340 560,370 L560,420 Z" fill="#2BB3B1" />
  <!-- Patient Hair -->
  <path d="M495,300 C495,270 520,265 540,275 C550,285 550,305 540,315 C520,295 495,295 495,300 Z" fill="#1E293B" />
  
  <!-- Speech Bubble -->
  <path d="M340,250 C340,220 380,200 420,220 C430,225 435,235 440,245 L450,260 L430,255 C410,265 370,270 340,250 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <path d="M370,230 L410,230 M370,245 L400,245" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

  <!-- Plant -->
  <path d="M140,420 Q120,350 140,300 Q160,350 140,420 Z" fill="#10B981" />
  <path d="M140,420 Q150,360 180,320 Q170,370 140,420 Z" fill="#34D399" />
  <path d="M140,420 Q130,360 100,320 Q110,370 140,420 Z" fill="#059669" />
  <rect x="120" y="420" width="40" height="40" fill="#E55C13" rx="4" />
  
  <!-- Clock -->
  <circle cx="650" cy="200" r="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
  <path d="M650,200 L650,180 M650,200 L665,200" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
</svg>
